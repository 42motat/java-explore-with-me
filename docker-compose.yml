services:
  stats-db:
    image: postgres:16.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: statsdbuser
      POSTGRES_PASSWORD: 12345

  stats-server:
    build:
      context: ./stats-service/stats-server
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_USERNAME: statsdbuser
      SPRING_DATASOURCE_PASSWORD: 12345

  ewm-service:
    build: ./main-app-service
    ports:
      - "8080:8080"

  ewm-db:
    image: postgres:16.1
